<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Gestione Channel - Software dinamico</title>
  <script>
    if (sessionStorage.getItem("gestione-channel-access") !== "granted") {
      location.replace("./");
    }
  </script>
  <link rel="stylesheet" href="public/channel/styles.css?v=20261005-market-globe-v4" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="public/channel/assets/barbarhouse-logo.png" alt="BarbarHouse" />
        <div>
          <h1>Gestione Channel</h1>
          <p>Stay timing, Booking, calendario offerte</p>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="side-status">
        <span id="dirtyDot" class="dot"></span>
        <span id="saveState">Stato locale pronto</span>
      </div>
    </aside>
    <main class="workspace">
      <header class="topbar">
        <div class="history-controls">
          <button id="pageBack" class="icon-btn" title="Pagina precedente">←</button>
          <button id="pageForward" class="icon-btn" title="Pagina successiva">→</button>
        </div>
        <div class="toolbar">
          <button id="undoBtn" title="Annulla ultima modifica">↶ Annulla</button>
          <button id="redoBtn" title="Ripeti modifica annullata">↷ Ripeti</button>
          <button id="saveBtn" class="primary" title="Salva nel browser">Salva</button>
          <button id="exportBtn" title="Esporta stato JSON">Esporta</button>
          <label class="import-label" title="Importa stato JSON">Importa<input id="importFile" type="file" accept="application/json" /></label>
          <button id="resetBtn" class="danger" title="Ripristina dati del file Excel">Reset</button>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
    <div id="saveNotice" class="save-notice" role="status" aria-live="polite">Salvataggio completato</div>
  </div>
  <script src="public/channel/workbook-data.js?v=20260803-piani-markup-nrpub"></script>
  <script src="public/channel/roomnight-seed-data.js?v=20260803-piani-markup-nrpub"></script>
  <script src="public/channel/roomnight-native.js?v=20260803-piani-markup-nrpub"></script>
  <script src="public/channel/tourist-tax-data.js?v=20260807-12556-righe"></script>
  <script src="public/channel/italian-municipalities.js?v=20260814-istat-20260221"></script>
  <script src="public/channel/technical-guide.js?v=20260925-guide-v1"></script>
  <script src="https://unpkg.com/globe.gl@2.33.1/dist/globe.gl.min.js"></script>
  <script src="public/channel/app.js?v=20261005-market-globe-v4"></script>
</body>
</html>
